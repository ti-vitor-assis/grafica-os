<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- VERIFICAR COM PROFESSOR
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' ">
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../public/css/style.css" rel="stylesheet">
    <title>Bem vindo</title>
</head>

<body>
    <div class="base">

        <div class="left_side">
            <button id="btnClientes" onclick="api.openWindow('clientes')" class="text-white px-4 py-2 rounded hover:bg-purple-700 transition btn-sm btnStyle mt-1">
                <div class="row">
                    <div class="col imageColumn">
                        <img src="../public/img/clientsIcon.png" alt="Clients Icon" class="clientsIcon">
                    </div>
                    <div class="col">
                        <p class="menuLabels">Clientes</p>
                    </div>
                </div>
            </button>

            <button id="btnOS" onclick="api.openWindow('os')" class="text-white px-4 py-2 rounded hover:bg-purple-700 transition btn-sm btnStyle mt-1">
                <div class="row">
                    <div class="col imageColumn">
                        <img src="../public/img/serviceOrderIcon.png" alt="Service Order Icon" class="soIcon">
                    </div>
                    <div class="col">
                        <p class="menuLabels">Serviços</p>
                    </div>
                </div>
            </button>

            <button id="btnProdutos" onclick="api.openWindow('produtos')" class="text-white px-4 py-2 rounded hover:bg-purple-700 transition btn-sm btnStyle mt-1">
                <div class="row">
                    <div class="col imageColumn">
                        <!-- Ícone de produto (caixa), no mesmo estilo de linha branca dos outros -->
                        <svg class="soIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
                            stroke-linecap="round" stroke-linejoin="round" aria-label="Products Icon">
                            <path d="M21 8l-9-5-9 5 9 5 9-5z" />
                            <path d="M3 8v8l9 5 9-5V8" />
                            <path d="M12 13v8" />
                            <path d="M7.5 5.5l9 5" />
                        </svg>
                    </div>
                    <div class="col">
                        <p class="menuLabels">Produtos</p>
                    </div>
                </div>
            </button>

            <button id="btnRelatorios" class="text-white px-4 py-2 rounded hover:bg-purple-700 transition btn-sm btnStyle mt-1">
                <div class="row">
                    <div class="col imageColumn">
                        <img src="../public/img/reportsIcon.png" alt="Service Order Icon" class="soIcon">
                    </div>
                    <div class="col ">
                        <p class="menuLabels">Relatórios</p>
                    </div>
                </div>
            </button>
        </div>

        <div class="right_side">

            <section class="right_top">
                <div class="grafico-container">
                    <h2 class="titulo text-white">Visão Geral</h2>
                    <canvas id="pieChart" width="400" height="400"></canvas>
                    <p id="semOS" class="text-sm text-[var(--color-text-secondary)] px-2" hidden>
                        Nenhuma OS em andamento ou entregue ainda.
                    </p>
                </div>

                <div class="delayedservices text-white flex flex-col">
                    <h1 class="font-bold text-center text-xl mb-2">Serviços Atrasados / Próximos do Prazo</h1>
                    <div class="flex-1 overflow-y-auto mx-2 mb-2 rounded-lg">
                        <table class="w-full table-fixed text-sm">
                            <thead class="sticky top-0">
                                <tr>
                                    <th class="w-[60px] py-2 px-3 text-left font-bold uppercase">Nº</th>
                                    <th class="py-2 px-3 text-left font-bold uppercase">Cliente</th>
                                    <th class="w-[95px] py-2 px-3 text-left font-bold uppercase">Prazo</th>
                                    <th class="w-[135px] py-2 px-3 text-left font-bold uppercase">Situação</th>
                                </tr>
                            </thead>
                            <!-- Preenchida pelo renderer.js com dados do banco -->
                            <tbody id="tabelaPrazos"></tbody>
                        </table>
                        <p id="semPrazos" class="text-center text-sm text-[var(--color-text-secondary)] pt-6" hidden>
                            Nenhuma OS atrasada ou vencendo nos próximos 3 dias. 🎉
                        </p>
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p id="footerRealTime"></p>
            <img src="../public/img/dboffRed.png" alt="Icone banco de dados" id="iconeDB">
        </footer>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../public/js/renderer.js"></script>
    <script src="../public/js/footer.js"></script>

</body>

</html>
