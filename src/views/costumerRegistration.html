<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Só scripts/estilos do próprio app; conexão externa apenas com o ViaCEP (busca de CEP) -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://viacep.com.br" />
    <link href="../public/css/app.css" rel="stylesheet" />
    <link href="../public/css/tailwind.css" rel="stylesheet" />
    <title>Clientes</title>
</head>

<body class="tela">
    <header class="tela-cabecalho">
        <div class="tela-titulo">
            <span class="tela-icone"><i data-icone="clientes" data-tamanho="20"></i></span>
            <div>
                <h1>Clientes</h1>
                <p>Cadastro de clientes da gráfica</p>
            </div>
        </div>
        <form id="frmSearchClient" class="busca">
            <div class="busca-campo">
                <i data-icone="busca" data-tamanho="16"></i>
                <input type="search" name="searchName" id="searchClientsInput" class="input"
                    placeholder="Buscar por nome ou CPF" />
            </div>
            <button type="submit" id="searchBtn" class="btn btn-secundario">Buscar</button>
        </form>
    </header>

    <main class="tela-conteudo">
        <div class="layout-form-lista">

            <form id="frmCli" class="card">
                <div class="card-cabecalho">
                    <div>
                        <h2 id="tituloForm">Novo cliente</h2>
                        <p>Campos com <span class="obrigatorio">*</span> são obrigatórios</p>
                    </div>
                </div>

                <div class="card-corpo">
                    <input type="text" id="inputIdClient" hidden />

                    <!-- Dados pessoais -->
                    <div class="secao">
                        <p class="secao-titulo">Dados pessoais</p>
                        <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                            <div class="campo col-span-12">
                                <label for="inputNome">Nome completo <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputNome" class="input" required />
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputCPF">CPF <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputCPF" class="input" placeholder="000.000.000-00" required />
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputRG">RG</label>
                                <input type="text" id="inputRG" class="input" />
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputSexo">Sexo <span class="obrigatorio">*</span></label>
                                <select id="inputSexo" class="select" required>
                                    <option value="">Selecione</option>
                                    <option value="fem">Feminino</option>
                                    <option value="mas">Masculino</option>
                                    <option value="out">Outros</option>
                                </select>
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputDataNasc">Nascimento <span class="obrigatorio">*</span></label>
                                <input type="date" id="inputDataNasc" class="input" required />
                            </div>
                        </div>
                    </div>

                    <!-- Contato -->
                    <div class="secao">
                        <p class="secao-titulo">Contato</p>
                        <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                            <div class="campo col-span-3">
                                <label for="inputTelefone">Celular <span class="obrigatorio">*</span></label>
                                <input type="tel" id="inputTelefone" class="input" placeholder="(11) 90000-0000" required />
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputTelefone2">Telefone</label>
                                <input type="tel" id="inputTelefone2" class="input" />
                            </div>
                            <div class="campo col-span-6">
                                <label for="inputEmail">E-mail <span class="obrigatorio">*</span></label>
                                <input type="email" id="inputEmail" class="input" required />
                            </div>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="secao">
                        <p class="secao-titulo">Endereço</p>
                        <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                            <div class="campo col-span-3">
                                <label for="inputCep">CEP <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputCep" class="input" placeholder="00000-000" required />
                                <span class="ajuda">Preenche o endereço sozinho</span>
                            </div>
                            <div class="campo col-span-7">
                                <label for="inputEndereco">Endereço <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputEndereco" class="input" required />
                            </div>
                            <div class="campo col-span-2">
                                <label for="inputNum">Número <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputNum" class="input" required />
                            </div>
                            <div class="campo col-span-5">
                                <label for="inputComplemento">Complemento</label>
                                <input type="text" id="inputComplemento" class="input" />
                            </div>
                            <div class="campo col-span-7">
                                <label for="inputBairro">Bairro <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputBairro" class="input" required />
                            </div>
                            <div class="campo col-span-8">
                                <label for="inputCidade">Cidade <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputCidade" class="input" required />
                            </div>
                            <div class="campo col-span-4">
                                <label for="inputEstado">Estado <span class="obrigatorio">*</span></label>
                                <select id="inputEstado" class="select" required>
                                    <option value="">Selecione</option>
                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
                                    <option value="MA">Maranhão</option>
                                    <option value="MT">Mato Grosso</option>
                                    <option value="MS">Mato Grosso do Sul</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PA">Pará</option>
                                    <option value="PB">Paraíba</option>
                                    <option value="PR">Paraná</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="PI">Piauí</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="RN">Rio Grande do Norte</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="RO">Rondônia</option>
                                    <option value="RR">Roraima</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="SE">Sergipe</option>
                                    <option value="TO">Tocantins</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-acoes fixo">
                    <button type="button" id="btnDelete" data-permissao="excluir" class="btn btn-perigo some-desabilitado">
                        <i data-icone="lixeira" data-tamanho="16"></i> Excluir
                    </button>
                    <span class="espacador"></span>
                    <button type="reset" id="btnReset" class="btn btn-secundario">
                        <i data-icone="mais" data-tamanho="16"></i> Novo cliente
                    </button>
                    <button type="submit" id="btnCreate" class="btn btn-primario some-desabilitado">
                        <i data-icone="salvar" data-tamanho="16"></i> Cadastrar cliente
                    </button>
                    <button type="submit" id="btnUpdate" class="btn btn-primario some-desabilitado">
                        <i data-icone="salvar" data-tamanho="16"></i> Salvar alterações
                    </button>
                </div>
            </form>

            <aside class="card lista-lateral">
                <div class="card-cabecalho">
                    <div>
                        <h2>Resultados</h2>
                        <p id="contagemResultados">Busque por nome ou CPF</p>
                    </div>
                </div>
                <p id="semResultados" class="vazio">
                    <i data-icone="busca" data-tamanho="22"></i>
                    Os clientes encontrados aparecem aqui.
                </p>
                <ul id="listaResultados" class="lista"></ul>
            </aside>
        </div>
    </main>

    <footer class="statusbar"></footer>

    <!-- SCRIPTS -->
    <script src="../public/js/icones.js"></script>
    <script src="../public/js/costumerRegistrationRenderer.js"></script>
    <script src="../public/js/footer.js"></script>
</body>

</html>
