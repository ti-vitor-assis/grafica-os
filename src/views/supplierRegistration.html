<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Só scripts/estilos do próprio app (esta tela não tem onclick) -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link href="../public/css/app.css" rel="stylesheet" />
    <link href="../public/css/tailwind.css" rel="stylesheet" />
    <title>Fornecedores</title>
</head>

<body class="tela">
    <header class="tela-cabecalho">
        <div class="tela-titulo">
            <span class="tela-icone"><i data-icone="fornecedor" data-tamanho="20"></i></span>
            <div>
                <h1>Fornecedores</h1>
                <p>De quem a gráfica compra papel, tinta, lona e serviços</p>
            </div>
        </div>
        <form id="frmSearchSupplier" class="busca">
            <div class="busca-campo">
                <i data-icone="busca" data-tamanho="16"></i>
                <input type="search" id="searchSupplierInput" class="input"
                    placeholder="Buscar por nome, CNPJ/CPF ou o que fornece" />
            </div>
            <button type="submit" class="btn btn-secundario">Buscar</button>
        </form>
    </header>

    <main class="tela-conteudo">
        <div class="layout-form-lista">

            <form id="frmSupplier" class="card">
                <div class="card-cabecalho">
                    <div>
                        <h2 id="tituloForm">Novo fornecedor</h2>
                        <p>Campos com <span class="obrigatorio">*</span> são obrigatórios</p>
                    </div>
                </div>

                <div class="card-corpo">
                    <input type="text" id="inputIdSupplier" hidden />

                    <div class="secao">
                        <p class="secao-titulo">Empresa</p>
                        <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                            <div class="campo col-span-8">
                                <label for="inputNome">Nome / razão social <span class="obrigatorio">*</span></label>
                                <input type="text" id="inputNome" class="input" required />
                            </div>
                            <div class="campo col-span-4">
                                <label for="inputDocumento">CNPJ ou CPF</label>
                                <input type="text" id="inputDocumento" class="input" />
                            </div>
                            <div class="campo col-span-12">
                                <label for="inputFornece">O que fornece</label>
                                <input type="text" id="inputFornece" class="input"
                                    placeholder="ex.: papéis couché, tintas, lona" />
                            </div>
                        </div>
                    </div>

                    <div class="secao">
                        <p class="secao-titulo">Contato</p>
                        <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                            <div class="campo col-span-4">
                                <label for="inputContato">Pessoa de contato</label>
                                <input type="text" id="inputContato" class="input" />
                            </div>
                            <div class="campo col-span-3">
                                <label for="inputTelefone">Telefone</label>
                                <input type="tel" id="inputTelefone" class="input" />
                            </div>
                            <div class="campo col-span-5">
                                <label for="inputEmail">E-mail</label>
                                <input type="email" id="inputEmail" class="input" />
                            </div>
                            <div class="campo col-span-12">
                                <label for="inputObs">Observações</label>
                                <textarea id="inputObs" class="textarea" rows="3"
                                    placeholder="ex.: prazo de entrega, condições de pagamento"></textarea>
                            </div>
                            <div class="col-span-12">
                                <label class="checkbox"><input type="checkbox" id="inputAtivo" checked /> Ativo</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-acoes fixo">
                    <button type="button" id="btnDelete" data-permissao="excluir" class="btn btn-perigo some-desabilitado">
                        <i data-icone="lixeira" data-tamanho="16"></i> Excluir
                    </button>
                    <span class="espacador"></span>
                    <button type="button" id="btnReset" class="btn btn-secundario">
                        <i data-icone="mais" data-tamanho="16"></i> Novo fornecedor
                    </button>
                    <button type="submit" id="btnCreate" class="btn btn-primario some-desabilitado">
                        <i data-icone="salvar" data-tamanho="16"></i> Cadastrar fornecedor
                    </button>
                    <button type="submit" id="btnUpdate" class="btn btn-primario some-desabilitado">
                        <i data-icone="salvar" data-tamanho="16"></i> Salvar alterações
                    </button>
                </div>
            </form>

            <aside class="card lista-lateral">
                <div class="card-cabecalho">
                    <div>
                        <h2>Fornecedores</h2>
                        <p id="contagemResultados">Clique para editar</p>
                    </div>
                </div>
                <p id="semResultados" class="vazio" hidden>Nenhum fornecedor encontrado.</p>
                <ul id="listaResultados" class="lista"></ul>
            </aside>
        </div>
    </main>

    <footer class="statusbar"></footer>

    <!-- SCRIPTS -->
    <script src="../public/js/icones.js"></script>
    <script src="../public/js/supplierRegistrationRenderer.js"></script>
    <script src="../public/js/footer.js"></script>
</body>

</html>
