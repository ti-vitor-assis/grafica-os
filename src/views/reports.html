<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Só scripts/estilos do próprio app (esta tela não tem onclick) -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link href="../public/css/app.css" rel="stylesheet" />
    <link href="../public/css/tailwind.css" rel="stylesheet" />
    <title>Relatórios</title>
</head>

<body class="tela">
    <header class="tela-cabecalho">
        <div class="tela-titulo">
            <span class="tela-icone"><i data-icone="relatorio" data-tamanho="20"></i></span>
            <div>
                <h1>Relatórios</h1>
                <p>Escolha o relatório e o período; o resultado sai em PDF</p>
            </div>
        </div>
    </header>

    <main class="tela-conteudo">
        <form id="frmRelatorio" class="flex flex-col gap-5">

            <section>
                <p class="secao-titulo">Atendimento e produção</p>
                <div class="grade-opcoes">
                    <label class="opcao">
                        <input type="radio" name="tipo" value="clientes" />
                        <span class="opcao-icone"><i data-icone="clientes"></i></span>
                        <span><b>Clientes cadastrados</b><small>Contato e quantidade de OS de cada um</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="andamento" checked />
                        <span class="opcao-icone"><i data-icone="os"></i></span>
                        <span><b>OS em andamento</b><small>Não entregues, atrasadas e saldo a receber</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="entregues" data-periodo />
                        <span class="opcao-icone"><i data-icone="check"></i></span>
                        <span><b>OS entregues</b><small>No período, com % entregue no prazo</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="todas" data-periodo />
                        <span class="opcao-icone"><i data-icone="calendario"></i></span>
                        <span><b>Todas as OS</b><small>Abertas no período, em qualquer status</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="produtos" data-periodo />
                        <span class="opcao-icone"><i data-icone="produto"></i></span>
                        <span><b>Produtos mais vendidos</b><small>Quantidade e valor vendidos no período</small></span>
                    </label>
                </div>
            </section>

            <section data-permissao="financeiro">
                <p class="secao-titulo">Financeiro</p>
                <div class="grade-opcoes">
                    <label class="opcao">
                        <input type="radio" name="tipo" value="faturamento" data-periodo />
                        <span class="opcao-icone"><i data-icone="dinheiro"></i></span>
                        <span><b>Faturamento</b><small>OS entregues no período, ticket médio, por cliente</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="receber" />
                        <span class="opcao-icone"><i data-icone="relogio"></i></span>
                        <span><b>Contas a receber</b><small>OS com saldo em aberto hoje</small></span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="recebimentos" data-periodo />
                        <span class="opcao-icone"><i data-icone="entrada"></i></span>
                        <span><b>Recebimentos</b><small>Pagamentos lançados no período, por forma</small></span>
                    </label>
                </div>
            </section>

            <section data-permissao="estoque">
                <p class="secao-titulo">Estoque</p>
                <div class="grade-opcoes">
                    <label class="opcao">
                        <input type="radio" name="tipo" value="estoque" />
                        <span class="opcao-icone"><i data-icone="estoque"></i></span>
                        <span><b>Estoque de insumos</b><small>Situação atual e o que comprar</small></span>
                    </label>
                </div>
            </section>

            <section data-permissao="usuarios">
                <p class="secao-titulo">Segurança</p>
                <div class="grade-opcoes">
                    <label class="opcao">
                        <input type="radio" name="tipo" value="auditoria" data-periodo />
                        <span class="opcao-icone"><i data-icone="cadeado"></i></span>
                        <span><b>Registro de auditoria</b><small>Quem fez o quê no período: entradas, clientes, OS, LGPD</small></span>
                    </label>
                </div>
            </section>

            <!-- Período (só para os relatórios marcados com data-periodo) e ação -->
            <div class="card-acoes fixo avulsa !items-end">
                <fieldset id="campoPeriodo" class="flex items-end gap-3 border-0 p-0 m-0 disabled:opacity-40">
                    <div class="campo">
                        <label for="inputInicio">De</label>
                        <input type="date" id="inputInicio" class="input !w-[170px]" required />
                    </div>
                    <div class="campo">
                        <label for="inputFim">Até</label>
                        <input type="date" id="inputFim" class="input !w-[170px]" required />
                    </div>
                </fieldset>
                <span id="avisoPeriodo" class="ajuda pb-2">Este relatório não usa período</span>
                <span class="espacador"></span>
                <button type="submit" id="btnGerar" class="btn btn-primario">
                    <i data-icone="pdf" data-tamanho="16"></i> Gerar PDF
                </button>
            </div>
        </form>
    </main>

    <footer class="statusbar"></footer>

    <!-- SCRIPTS -->
    <script src="../public/js/icones.js"></script>
    <script src="../public/js/reportsRenderer.js"></script>
    <script src="../public/js/footer.js"></script>
</body>

</html>
