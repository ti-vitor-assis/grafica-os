<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Só scripts/estilos do próprio app (esta tela não tem onclick) -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link href="../public/css/app.css" rel="stylesheet" />
    <link href="../public/css/tailwind.css" rel="stylesheet" />
    <title>Usuários</title>
</head>

<body class="tela">
    <header class="tela-cabecalho">
        <div class="tela-titulo">
            <span class="tela-icone"><i data-icone="usuarios" data-tamanho="20"></i></span>
            <div>
                <h1>Usuários</h1>
                <p>Funcionários que entram no sistema e o que cada um pode fazer</p>
            </div>
        </div>
    </header>

    <main class="tela-conteudo">
        <div class="layout-form-lista">

            <form id="frmUsuario" class="card">
                <div class="card-cabecalho">
                    <div>
                        <h2 id="tituloModo">Novo usuário</h2>
                        <p>Usuários não são excluídos: desative para bloquear o acesso</p>
                    </div>
                </div>

                <div class="card-corpo grid grid-cols-12 gap-x-4 gap-y-3">
                    <input type="text" id="inputIdUsuario" hidden />
                    <div class="campo col-span-7">
                        <label for="inputNome">Nome <span class="obrigatorio">*</span></label>
                        <input type="text" id="inputNome" class="input" required />
                    </div>
                    <div class="campo col-span-5">
                        <label for="inputLogin">Login <span class="obrigatorio">*</span></label>
                        <input type="text" id="inputLogin" class="input" autocomplete="off" placeholder="ex.: ana.silva" required />
                    </div>
                    <div class="campo col-span-12">
                        <label for="inputPerfil">Perfil</label>
                        <select id="inputPerfil" class="select">
                            <option value="atendente">Atendente: clientes, orçamentos, OS e relatórios</option>
                            <option value="produção">Produção: OS e estoque</option>
                            <option value="administrador">Administrador: acesso total</option>
                        </select>
                    </div>
                    <div class="campo col-span-6">
                        <label for="inputSenha" id="rotuloSenha">Senha</label>
                        <input type="password" id="inputSenha" class="input" autocomplete="new-password" minlength="6"
                            placeholder="mínimo 6 caracteres" />
                    </div>
                    <div class="campo col-span-6">
                        <label for="inputConfirma">Confirme a senha</label>
                        <input type="password" id="inputConfirma" class="input" autocomplete="new-password" minlength="6" />
                    </div>
                    <div class="col-span-12">
                        <label class="checkbox"><input type="checkbox" id="inputAtivo" checked /> Ativo (pode entrar no sistema)</label>
                    </div>
                </div>

                <div class="card-acoes">
                    <span class="espacador"></span>
                    <button type="button" id="btnLimpar" class="btn btn-secundario">
                        <i data-icone="mais" data-tamanho="16"></i> Novo usuário
                    </button>
                    <button type="submit" id="btnSalvar" class="btn btn-primario">
                        <i data-icone="salvar" data-tamanho="16"></i> <span id="textoSalvar">Cadastrar usuário</span>
                    </button>
                </div>
            </form>

            <aside class="card lista-lateral">
                <div class="card-cabecalho">
                    <div>
                        <h2>Usuários cadastrados</h2>
                        <p>Clique para editar</p>
                    </div>
                </div>
                <ul id="listaUsuarios" class="lista"></ul>
            </aside>
        </div>
    </main>

    <footer class="statusbar"></footer>

    <!-- SCRIPTS -->
    <script src="../public/js/icones.js"></script>
    <script src="../public/js/userRegistrationRenderer.js"></script>
    <script src="../public/js/footer.js"></script>
</body>

</html>
