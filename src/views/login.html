<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Só scripts/estilos do próprio app -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link href="../public/css/app.css" rel="stylesheet" />
    <link href="../public/css/tailwind.css" rel="stylesheet" />
    <title>Gráfica OS · Login</title>
</head>

<body class="tela">
    <div></div>

    <main class="tela-conteudo flex items-center justify-center">
        <section class="card w-full max-w-[360px]">
            <div class="card-corpo !p-7">

                <!-- Marca -->
                <div class="flex flex-col items-center text-center mb-6">
                    <span class="tela-icone !w-14 !h-14 !rounded-2xl mb-3"><i data-icone="grafica" data-tamanho="28"></i></span>
                    <h1 class="text-xl font-bold m-0">Gráfica OS</h1>
                    <p id="subtitulo" class="text-sm texto-mutado mt-1">Conectando ao banco de dados...</p>
                </div>

                <!-- Login -->
                <form id="frmLogin" class="flex flex-col gap-4" hidden>
                    <div class="campo">
                        <label for="inputLogin">Login</label>
                        <input type="text" id="inputLogin" class="input" autocomplete="username" required />
                    </div>
                    <div class="campo">
                        <label for="inputSenha">Senha</label>
                        <input type="password" id="inputSenha" class="input" autocomplete="current-password" required />
                    </div>
                    <button type="submit" class="btn btn-primario w-full mt-1">Entrar</button>
                </form>

                <!-- Primeiro acesso: cadastro do administrador -->
                <form id="frmPrimeiroAcesso" class="flex flex-col gap-4" hidden>
                    <div class="alerta alerta-info">
                        <i data-icone="info"></i>
                        <span><b>Primeiro acesso.</b> Crie o usuário administrador. Depois ele cadastra os outros
                            funcionários.</span>
                    </div>
                    <div class="campo">
                        <label for="inputAdminNome">Seu nome</label>
                        <input type="text" id="inputAdminNome" class="input" required />
                    </div>
                    <div class="campo">
                        <label for="inputAdminLogin">Login</label>
                        <input type="text" id="inputAdminLogin" class="input" autocomplete="username"
                            placeholder="ex.: vitor" required />
                    </div>
                    <div class="campo">
                        <label for="inputAdminSenha">Senha</label>
                        <input type="password" id="inputAdminSenha" class="input" autocomplete="new-password"
                            minlength="6" placeholder="mínimo 6 caracteres" required />
                    </div>
                    <div class="campo">
                        <label for="inputAdminConfirma">Confirme a senha</label>
                        <input type="password" id="inputAdminConfirma" class="input" autocomplete="new-password"
                            minlength="6" required />
                    </div>
                    <button type="submit" class="btn btn-primario w-full mt-1">Criar e entrar</button>
                </form>

                <p id="erroLogin" class="text-center text-sm texto-perigo mt-4 mb-0 min-h-[20px]"></p>

                <!-- Aparece quando o banco não conecta -->
                <button type="button" id="btnConfigBanco" class="btn btn-secundario w-full mt-1" hidden>
                    <i data-icone="banco" data-tamanho="16"></i> Configurar banco de dados
                </button>
            </div>
        </section>
    </main>

    <footer class="statusbar"></footer>

    <!-- SCRIPTS -->
    <script src="../public/js/icones.js"></script>
    <script src="../public/js/loginRenderer.js"></script>
    <script src="../public/js/footer.js"></script>
</body>

</html>
