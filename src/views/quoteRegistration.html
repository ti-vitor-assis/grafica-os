<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../public/css/costumerRegistrationStyle.css" rel="stylesheet" />
  <link href="../public/css/tailwind.css" rel="stylesheet" />
  <title>Orçamentos</title>
</head>

<body>
  <div class="base">

    <!-- SEARCH SECTION: cliente à esquerda, número do orçamento à direita -->
    <section class="searchSection flex items-center px-4 gap-4">
      <form id="frmSearchClient" class="flex items-center gap-3">
        <input type="text" class="inputStyle w-[420px]" id="searchClientsInput"
          placeholder="  Buscar cliente por nome ou CPF...                                              🔍︎" />
        <button type="submit" class="btns">BUSCAR</button>
      </form>
      <form id="frmSearchQuote" class="flex items-center gap-3 ml-auto">
        <input type="number" min="1" step="1" class="inputStyle w-[170px]" id="searchQuoteInput"
          placeholder="  Nº do orçamento" />
        <button type="submit" class="btns">ABRIR</button>
      </form>
    </section>

    <hr class="blockDivision border-t-2 border-[var(--color-primary)] mx-auto mt-2 opacity-40 rounded" />

    <!-- REGISTER SECTION -->
    <section class="registerSection text-[var(--color-text-primary)]">

      <!-- Formulário do orçamento -->
      <section class="w-[640px] p-4">
        <form id="frmQuote" class="space-y-2">

          <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold">
              Orçamento <span id="numeroQuote" class="text-[var(--color-text-secondary)]">(novo)</span>
            </h1>
            <span id="etiquetaStatus" class="text-white text-sm rounded-full px-3 py-1" hidden></span>
          </div>

          <!-- IDs ocultos -->
          <input type="text" id="inputIdQuote" hidden />
          <input type="text" id="inputIdClient" hidden />

          <!-- Cliente -->
          <input type="text" class="inputStyle w-full" id="inputNome" readonly
            placeholder="  Cliente * (use a busca acima)" />

          <!-- Adicionar item: os campos usam form="frmItem" para NÃO entrarem na
               validação do formulário (um "0" esquecido na quantidade
               bloquearia o botão Criar) -->
          <div class="flex gap-2">
            <select id="selectProduto" form="frmItem" class="inputStyle flex-1 min-w-0">
              <option value="">Selecione um produto...</option>
            </select>
            <input type="number" id="inputQtd" form="frmItem" min="1" step="1" class="inputStyle w-[90px]" placeholder="  Qtd" />
            <input type="number" id="inputValorUn" form="frmItem" min="0" step="0.01" class="inputStyle w-[120px]"
              placeholder="  Valor un." />
            <button type="button" id="btnAddItem" class="btns !w-[90px]">+ Item</button>
          </div>

          <!-- Itens do orçamento -->
          <div class="h-[130px] overflow-y-auto rounded-[10px] bg-[var(--color-background)]">
            <table class="w-full text-sm">
              <thead class="sticky top-0 bg-[var(--color-background)] text-[var(--color-text-secondary)]">
                <tr>
                  <th class="text-left px-3 py-1 font-normal">Produto</th>
                  <th class="text-right px-2 py-1 font-normal">Qtd</th>
                  <th class="text-right px-2 py-1 font-normal">Valor un.</th>
                  <th class="text-right px-2 py-1 font-normal">Subtotal</th>
                  <th class="w-[36px]"></th>
                </tr>
              </thead>
              <tbody id="tabelaItens"></tbody>
            </table>
            <p id="semItens" class="text-center text-sm text-[var(--color-text-secondary)] pt-6">
              Nenhum item adicionado.
            </p>
          </div>

          <!-- Totais -->
          <div class="flex items-baseline justify-between">
            <span id="textoSituacao" class="text-sm text-[var(--color-text-secondary)]"></span>
            <span class="text-lg font-semibold">Total: <span id="valorTotal">R$ 0,00</span></span>
          </div>

          <!-- Validade e prazo de produção -->
          <div class="flex gap-2 items-center">
            <label for="inputValidade" class="text-sm whitespace-nowrap">Válido até *</label>
            <input type="date" id="inputValidade" class="inputStyle w-[165px] pr-3" required />
            <label for="inputPrazoProducao" class="text-sm whitespace-nowrap ml-3">Produção em *</label>
            <input type="number" id="inputPrazoProducao" min="1" step="1" class="inputStyle w-[75px]" value="5"
              required />
            <span class="text-sm whitespace-nowrap">dias após aprovar</span>
          </div>

          <!-- Observações -->
          <textarea id="inputObs" class="inputStyle w-full h-[100px] pt-2 resize-none"
            placeholder="Observações (ex.: condições de pagamento, frete, detalhes da arte)"></textarea>

          <!-- Botões -->
          <div class="flex flex-wrap gap-3">
            <button type="submit" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnCreate">
              Criar orçamento
            </button>
            <button type="submit" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnUpdate">
              Salvar alterações
            </button>
            <button type="button" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnDelete"
              onclick="removeQuote()">
              Excluir
            </button>
            <button type="button" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed !border-[var(--color-success)]" id="btnConvert"
              onclick="convertQuote()">
              Aprovado → gerar OS
            </button>
            <button type="button" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnRefuse"
              onclick="refuseQuote()">
              Recusado
            </button>
            <button type="button" class="inputStyle px-4 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnPrint"
              onclick="printQuote()">
              Imprimir
            </button>
            <button type="button" class="inputStyle px-2 py-1 rounded text-white hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed" id="btnReset"
              onclick="resetForm()">
              Limpar
            </button>
          </div>
        </form>
        <form id="frmItem"></form>
      </section>

      <!-- Lista ao lado: clientes encontrados ou OS do cliente -->
      <section class="flex-1 p-4 pl-0">
        <div class="h-full rounded-[5px] bg-[var(--color-background)] p-3 flex flex-col">
          <h2 id="tituloLista" class="font-semibold mb-2">Orçamentos</h2>
          <p id="semResultados" class="text-[var(--color-text-secondary)] text-sm">
            Busque um cliente para ver os orçamentos dele, ou digite o número de um orçamento.
          </p>
          <ul id="listaResultados" class="overflow-y-auto space-y-2"></ul>
        </div>
      </section>
    </section>
  </div>

  <!-- FOOTER -->
  <footer>
    <p id="footerRealTime"></p>
    <img src="../public/img/dboffRed.png" alt="Icone banco de dados" id="iconeDB" />
  </footer>

  <!-- SCRIPTS -->
  <script src="../public/js/documentoComercial.js"></script>
  <script src="../public/js/quoteRegistrationRenderer.js"></script>
  <script src="../public/js/footer.js"></script>
</body>

</html>
